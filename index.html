<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>STARFALL — neon arena survival</title>
<style>
  :root {
    --cyan:   #5ef7ff;
    --pink:   #ff5ec4;
    --violet: #8b6cff;
    --amber:  #ffb340;
    --mint:   #58ffa1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #03060f;
    color: #dff6ff;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  canvas { position: fixed; inset: 0; display: block; cursor: crosshair; }

  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(8,18,44,0.30) 0%, rgba(2,4,12,0.82) 100%);
    transition: opacity .28s ease;
    padding: 24px;
  }
  .screen.hidden { opacity: 0; visibility: hidden; }

  .title {
    margin: 0;
    font-size: clamp(42px, 11vw, 108px);
    font-weight: 800;
    letter-spacing: .24em;
    text-indent: .24em;
    color: #eafcff;
    text-shadow: 0 0 10px rgba(94,247,255,.95), 0 0 38px rgba(94,247,255,.55), 0 0 92px rgba(139,108,255,.45);
  }
  .subtitle {
    margin: 10px 0 0;
    font-size: clamp(10px, 1.8vw, 14px);
    letter-spacing: .52em;
    text-indent: .52em;
    color: #7fd2ff;
    text-shadow: 0 0 14px rgba(94,247,255,.5);
  }
  .controls { margin-top: 34px; display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: .16em; color: #a9cff0; }
  .key {
    min-width: 108px; padding: 7px 12px;
    border: 1px solid rgba(94,247,255,.45);
    border-radius: 7px;
    background: rgba(94,247,255,.07);
    box-shadow: 0 0 14px rgba(94,247,255,.18) inset, 0 0 12px rgba(94,247,255,.14);
    color: #d8fbff; font-weight: 600;
  }
  .hint {
    margin-top: 34px; font-size: 13px; letter-spacing: .3em; text-indent: .3em;
    color: #9fd8ff; animation: pulse 1.7s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .30; } 50% { opacity: 1; } }

  .over-title {
    margin: 0; font-size: clamp(30px, 7vw, 64px); font-weight: 800;
    letter-spacing: .2em; text-indent: .2em; color: #ffe9fb;
    text-shadow: 0 0 12px rgba(255,94,196,.9), 0 0 46px rgba(255,94,196,.45);
  }
  .score-big {
    margin-top: 18px; font-size: clamp(38px, 9vw, 78px); font-weight: 800;
    color: #eafcff; letter-spacing: .06em;
    text-shadow: 0 0 14px rgba(94,247,255,.85), 0 0 48px rgba(94,247,255,.4);
    font-variant-numeric: tabular-nums;
  }
  .score-label { margin-top: 2px; font-size: 11px; letter-spacing: .42em; text-indent: .42em; color: #74b6dd; }
  .best-line { margin-top: 22px; font-size: 14px; letter-spacing: .22em; color: #ffd8a8; text-shadow: 0 0 14px rgba(255,179,64,.5); }
  .newbest {
    margin-top: 12px; font-size: 12px; letter-spacing: .34em; text-indent: .34em; color: #58ffa1;
    text-shadow: 0 0 16px rgba(88,255,161,.8); animation: pulse 1.1s ease-in-out infinite;
  }
  .newbest.hidden { opacity: 0; visibility: hidden; }
  .stats { margin-top: 20px; font-size: 12px; letter-spacing: .18em; color: #7fa8c8; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="screen">
  <h1 class="title">STARFALL</h1>
  <p class="subtitle">NEON ARENA SURVIVAL</p>
  <div class="controls">
    <div class="row"><span class="key">W A S D / &#8593;&#8592;&#8595;&#8594;</span><span>FLY</span></div>
    <div class="row"><span class="key">MOUSE</span><span>AIM</span></div>
    <div class="row"><span class="key">HOLD LMB</span><span>FIRE</span></div>
  </div>
  <div class="hint">PRESS SPACE OR CLICK TO LAUNCH</div>
</div>

<div id="overScreen" class="screen hidden">
  <h2 class="over-title">GAME OVER</h2>
  <div class="score-label">FINAL SCORE</div>
  <div class="score-big" id="finalScore">0</div>
  <div class="best-line">BEST <span id="finalBest">0</span></div>
  <div class="newbest hidden" id="newBest">&#9733; NEW BEST &#9733;</div>
  <div class="stats" id="finalStats"></div>
  <div class="hint">PRESS SPACE OR CLICK TO RESTART</div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     Helpers
     ============================================================ */
  var TAU = Math.PI * 2;
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b + 1)); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }

  /* ============================================================
     Canvas
     ============================================================ */
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 960, H = 600, DPR = 1;
  var bgGrad = null, vignette = null;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, window.innerWidth);
    H = Math.max(320, window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#061029');
    bgGrad.addColorStop(0.55, '#050c1e');
    bgGrad.addColorStop(1, '#02040d');

    var cx = W / 2, cy = H / 2;
    vignette = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.25, cx, cy, Math.max(W, H) * 0.78);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.55)');

    buildStars();
  }

  /* ============================================================
     State
     ============================================================ */
  var STATE = { START: 0, PLAY: 1, OVER: 2 };
  var state = STATE.START;

  var BEST_KEY = 'starfall.best';
  function loadBest() {
    try { return parseInt(window.localStorage.getItem(BEST_KEY) || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { window.localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }
  var best = loadBest();

  var time = 0;          // global clock (seconds)
  var elapsed = 0;       // run time
  var difficulty = 0;    // 0..1
  var score = 0;
  var xp = 0, xpNeed = 8;
  var shake = 0;
  var spawnTimer = 1;
  var overTimer = 0;
  var kills = 0, shardsCollected = 0;

  var bullets = [], enemies = [], shards = [], particles = [], texts = [], rings = [], ambient = [];

  var player = {
    x: 0, y: 0, vx: 0, vy: 0, r: 13, speed: 258,
    angle: -Math.PI / 2, thrust: 0,
    lives: 3, invuln: 0, fireRate: 4.4, fireTimer: 0, level: 1
  };

  var mouse = { x: 0, y: 0, down: false };
  var keys = Object.create(null);

  /* ============================================================
     Audio (tiny synth, no assets)
     ============================================================ */
  var actx = null, master = null, muted = false, audioFails = 0;
  function initAudio() {
    if (actx || audioFails > 2) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { audioFails = 99; return; }
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.22;
      master.connect(actx.destination);
    } catch (e) { audioFails++; actx = null; }
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!actx || muted || state === STATE.START) return;
    try {
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      var t0 = actx.currentTime;
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(24, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.15), t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function chord(notes, dur, type, vol) {
    for (var i = 0; i < notes.length; i++) {
      (function (f, i2) {
        setTimeout(function () { beep(f, dur, type || 'triangle', vol || 0.14); }, i2 * 70);
      })(notes[i], i);
    }
  }

  /* ============================================================
     Starfield (3 parallax layers)
     ============================================================ */
  var LAYERS = [
    { depth: 0.014, speed: 5,  count: 110, min: 0.5, max: 1.2, alpha: 0.34 },
    { depth: 0.038, speed: 11, count: 62,  min: 0.9, max: 1.8, alpha: 0.55 },
    { depth: 0.075, speed: 19, count: 30,  min: 1.4, max: 2.6, alpha: 0.9  }
  ];
  var stars = [];
  function buildStars() {
    stars = [];
    var scale = clamp((W * H) / (1280 * 720), 0.55, 1.8);
    for (var i = 0; i < LAYERS.length; i++) {
      var L = LAYERS[i];
      var n = Math.round(L.count * scale);
      for (var j = 0; j < n; j++) {
        stars.push({
          l: i,
          x: Math.random() * W,
          y: Math.random() * H,
          r: rand(L.min, L.max),
          tw: Math.random() * TAU,
          tws: rand(0.5, 2.0)
        });
      }
    }
  }
  function updateStars(dt) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], L = LAYERS[s.l];
      s.x -= L.speed * dt;
      s.y += L.speed * 0.35 * dt;
      s.tw += s.tws * dt;
      if (s.x < -4) { s.x = W + 4; s.y = Math.random() * H; }
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    }
  }
  function drawStars() {
    var px = (player.x - W / 2), py = (player.y - H / 2);
    ctx.shadowBlur = 0;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], L = LAYERS[s.l];
      var x = ((s.x - px * L.depth) % W + W) % W;
      var y = ((s.y - py * L.depth) % H + H) % H;
      var a = L.alpha * (0.62 + 0.38 * Math.sin(s.tw));
      ctx.fillStyle = 'rgba(200,235,255,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, TAU);
      ctx.fill();
    }
  }

  /* ============================================================
     Enemy kinds
     ============================================================ */
  var TYPES = {
    chaser: { r: 15, speed: 76,  hp: 3, score: 10, color: '#8b6cff', fill: 'rgba(139,108,255,0.16)',  drop: 2, sides: 3, glow: 16 },
    darter: { r: 10, speed: 172, hp: 1, score: 15, color: '#ff5ec4', fill: 'rgba(255,94,196,0.16)',  drop: 1, sides: 3, glow: 14 },
    tank:   { r: 26, speed: 48,  hp: 9, score: 35, color: '#ffb340', fill: 'rgba(255,179,64,0.13)', drop: 5, sides: 6, glow: 22 }
  };

  function makeEnemy(type, x, y, opts) {
    var d = TYPES[type];
    opts = opts || {};
    var hpScale = 1 + clamp(elapsed / 95, 0, 1.6);
    var spScale = 1 + clamp(elapsed / 190, 0, 1) * 0.5;
    var e = {
      type: type,
      x: x, y: y,
      r: opts.r || d.r,
      hp: opts.hp || Math.ceil(d.hp * hpScale),
      maxhp: 0,
      speed: (opts.speed || d.speed * spScale) * (opts.speedMul || 1),
      color: d.color, fill: d.fill, sides: d.sides, glow: d.glow,
      drop: opts.drop || d.drop,
      score: d.score,
      ang: 0, rot: Math.random() * TAU, spin: rand(-1.2, 1.2),
      flash: 0, seed: Math.random() * TAU,
      ix: opts.ix || 0, iy: opts.iy || 0,
      splitter: !!opts.splitter,
      ambient: false,
      vx: 0, vy: 0
    };
    e.maxhp = e.hp;
    return e;
  }

  function spawnEnemy(type) {
    if (enemies.length > 100) return;
    var d, roll = Math.random();
    if (!type) {
      var tankChance = elapsed > 10 ? 0.13 + difficulty * 0.14 : 0;
      var darterChance = 0.28 + difficulty * 0.18;
      if (roll < tankChance) type = 'tank';
      else if (roll < tankChance + darterChance) type = 'darter';
      else type = 'chaser';
    }
    d = TYPES[type];
    var m = d.r + 34, x, y;
    var edge = randi(0, 3);
    if (edge === 0) { x = rand(0, W); y = -m; }
    else if (edge === 1) { x = W + m; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = H + m; }
    else { x = -m; y = rand(0, H); }
    enemies.push(makeEnemy(type, x, y));
  }

  function splitTank(e) {
    var kidHp = Math.max(1, Math.ceil(e.hp * 0.5));
    for (var i = 0; i < 2; i++) {
      var a = Math.random() * TAU;
      var kid = makeEnemy('chaser', e.x + Math.cos(a) * 8, e.y + Math.sin(a) * 8, {
        r: 12,
        hp: kidHp,
        drop: 1,
        speedMul: 1.25,
        ix: Math.cos(a) * 190,
        iy: Math.sin(a) * 190,
        splitter: true
      });
      kid.score = 8;
      enemies.push(kid);
    }
  }

  /* ============================================================
     Effects
     ============================================================ */
  function shakeIt(v) { shake = Math.min(30, shake + v); }

  function burst(x, y, color, count, speed, life) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * TAU;
      var s = rand(speed * 0.25, speed);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(0.25, (life || 0.6)),
        max: (life || 0.6),
        size: rand(1.3, 3.4),
        color: color
      });
    }
    if (particles.length > 900) particles.splice(0, particles.length - 900);
  }

  function ring(x, y, color, r0, vr, life) {
    rings.push({ x: x, y: y, r: r0, vr: vr, life: life, max: life, color: color });
  }

  function addText(x, y, str, color) {
    texts.push({ x: x, y: y, t: str, color: color, life: 0.95, max: 0.95 });
    if (texts.length > 40) texts.shift();
  }

  /* ============================================================
     Game flow
     ============================================================ */
  var elStart = document.getElementById('startScreen');
  var elOver = document.getElementById('overScreen');
  var elFinalScore = document.getElementById('finalScore');
  var elFinalBest = document.getElementById('finalBest');
  var elNewBest = document.getElementById('newBest');
  var elStats = document.getElementById('finalStats');

  function resetAmbient() {
    ambient = [];
    var kinds = ['chaser', 'darter', 'tank', 'chaser', 'darter', 'tank', 'chaser'];
    for (var i = 0; i < kinds.length; i++) {
      var e = makeEnemy(kinds[i], rand(0, W), rand(0, H));
      var a = Math.random() * TAU;
      e.speed *= 0.45;
      e.vx = Math.cos(a) * e.speed;
      e.vy = Math.sin(a) * e.speed;
      e.ambient = true;
      ambient.push(e);
    }
  }

  function resetGame() {
    player.x = W / 2; player.y = H / 2;
    player.vx = 0; player.vy = 0;
    player.lives = 3;
    player.invuln = 1.2;
    player.fireRate = 4.4;
    player.fireTimer = 0;
    player.level = 1;
    player.thrust = 0;
    player.angle = -Math.PI / 2;
    bullets.length = 0; enemies.length = 0; shards.length = 0;
    particles.length = 0; texts.length = 0; rings.length = 0;
    elapsed = 0; difficulty = 0; score = 0; xp = 0; xpNeed = 8;
    spawnTimer = 0.5; shake = 0; kills = 0; shardsCollected = 0;
  }

  function startGame() {
    initAudio();
    resetGame();
    state = STATE.PLAY;
    elStart.classList.add('hidden');
    elOver.classList.add('hidden');
    ring(player.x, player.y, '#5ef7ff', 8, 300, 0.5);
    burst(player.x, player.y, '#5ef7ff', 18, 240, 0.5);
  }

  function gameOver() {
    state = STATE.OVER;
    overTimer = 0;
    var isNew = score > best;
    if (isNew) { best = score; saveBest(best); }
    elFinalScore.textContent = score.toLocaleString('en-US');
    elFinalBest.textContent = best.toLocaleString('en-US');
    elStats.textContent = 'LEVEL ' + player.level + '   \u00b7   ' + kills + ' KILLS   \u00b7   ' +
                          shardsCollected + ' SHARDS   \u00b7   ' + Math.floor(elapsed) + 's';
    if (isNew) elNewBest.classList.remove('hidden'); else elNewBest.classList.add('hidden');
    elOver.classList.remove('hidden');
    burst(player.x, player.y, '#5ef7ff', 60, 420, 1.1);
    burst(player.x, player.y, '#ff5ec4', 30, 260, 0.9);
    ring(player.x, player.y, '#ffffff', 6, 520, 0.75);
    shakeIt(24);
    chord([520, 392, 262], 0.32, 'sawtooth', 0.16);
  }

  /* ============================================================
     Combat / progression
     ============================================================ */
  function fire() {
    var a = player.angle + rand(-0.045, 0.045);
    var sp = 620;
    var nose = player.r + 6;
    bullets.push({
      x: player.x + Math.cos(player.angle) * nose,
      y: player.y + Math.sin(player.angle) * nose,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1.15, dmg: 1
    });
    player.vx -= Math.cos(player.angle) * 14;
    player.vy -= Math.sin(player.angle) * 14;
    burst(player.x + Math.cos(player.angle) * nose, player.y + Math.sin(player.angle) * nose, '#bff9ff', 2, 60, 0.18);
    beep(rand(720, 820), 0.05, 'square', 0.045, 300);
  }

  function killEnemy(idx, byPlayer) {
    var e = enemies[idx];
    enemies.splice(idx, 1);

    var n = e.type === 'tank' ? 30 : (e.type === 'chaser' ? 16 : 12);
    burst(e.x, e.y, e.color, n, e.type === 'tank' ? 340 : 240, 0.7);
    ring(e.x, e.y, e.color, e.r * 0.6, e.type === 'tank' ? 420 : 260, 0.4);

    if (byPlayer) {
      score += e.score;
      kills++;
      addText(e.x, e.y - e.r - 4, '+' + e.score, e.color);
      beep(e.type === 'tank' ? 130 : 210, e.type === 'tank' ? 0.24 : 0.12, 'sawtooth', 0.11, 60);
      if (e.type === 'tank') shakeIt(6);
      for (var i = 0; i < e.drop; i++) {
        var a = Math.random() * TAU, s = rand(40, 150);
        shards.push({
          x: e.x + rand(-6, 6), y: e.y + rand(-6, 6),
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: 12, spin: rand(-4, 4), rot: Math.random() * TAU
        });
      }
      if (e.type === 'tank') splitTank(e);
    }
  }

  function levelUp() {
    xp -= xpNeed;
    player.level++;
    xpNeed = Math.floor(7 + player.level * 3 + Math.pow(player.level, 1.55));
    player.fireRate = Math.min(15, player.fireRate * 1.075 + 0.06);
    addText(player.x, player.y - player.r - 16, 'LV ' + player.level + '  RAPID FIRE', '#58ffa1');
    burst(player.x, player.y, '#58ffa1', 22, 280, 0.7);
    ring(player.x, player.y, '#58ffa1', 10, 340, 0.55);
    chord([660, 880, 1180], 0.14, 'triangle', 0.1);
  }

  function hitPlayer(e) {
    player.lives--;
    player.invuln = 2.2;
    shakeIt(15);
    burst(player.x, player.y, '#5ef7ff', 34, 340, 0.8);
    burst(player.x, player.y, '#ffffff', 12, 200, 0.5);
    ring(player.x, player.y, '#ffffff', 8, 420, 0.5);
    // shove the whole crowd away so we are not instantly re-hit
    for (var i = 0; i < enemies.length; i++) {
      var en = enemies[i];
      var ddx = en.x - player.x, ddy = en.y - player.y;
      var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
      if (dd < 92) {
        en.ix += (ddx / dd) * 340;
        en.iy += (ddy / dd) * 340;
      }
    }
    if (e) {
      e.flash = 0.12;
    }
    beep(150, 0.3, 'sawtooth', 0.2, 60);
    if (player.lives <= 0) {
      player.lives = 0;
      gameOver();
    }
  }

  /* ============================================================
     Update
     ============================================================ */
  function updateAmbient(dt) {
    if (ambient.length < 7 && Math.random() < dt * 1.2) {
      var kinds = ['chaser', 'darter', 'tank'];
      var e = makeEnemy(kinds[randi(0, 2)], rand(0, W), rand(0, H));
      var a = Math.random() * TAU;
      e.speed *= 0.45;
      e.vx = Math.cos(a) * e.speed;
      e.vy = Math.sin(a) * e.speed;
      e.ambient = true;
      ambient.push(e);
    }
    for (var i = 0; i < ambient.length; i++) {
      var en = ambient[i];
      en.x += en.vx * dt; en.y += en.vy * dt;
      en.rot += en.spin * dt * 0.6;
      var m = en.r + 70;
      if (en.x < -m) en.x = W + m; else if (en.x > W + m) en.x = -m;
      if (en.y < -m) en.y = H + m; else if (en.y > H + m) en.y = -m;
    }
  }

  function updateAmbientOnly(dt) {
    // particles etc. still breathe on menus
    updateAmbient(dt);
  }

  function updateParticles(dt) {
    var drag = Math.pow(0.045, dt);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= drag; p.vy *= drag;
    }
    for (var j = rings.length - 1; j >= 0; j--) {
      var r = rings[j];
      r.life -= dt;
      if (r.life <= 0) { rings.splice(j, 1); continue; }
      r.r += r.vr * dt;
      r.vr *= Math.pow(0.15, dt);
    }
    for (var k = texts.length - 1; k >= 0; k--) {
      var t = texts[k];
      t.life -= dt;
      if (t.life <= 0) { texts.splice(k, 1); continue; }
      t.y -= 34 * dt;
    }
  }

  function updatePlay(dt) {
    elapsed += dt;
    difficulty = clamp(elapsed / 165, 0, 1);

    /* ---- player ---- */
    var dx = 0, dy = 0;
    if (keys.KeyA || keys.ArrowLeft) dx -= 1;
    if (keys.KeyD || keys.ArrowRight) dx += 1;
    if (keys.KeyW || keys.ArrowUp) dy -= 1;
    if (keys.KeyS || keys.ArrowDown) dy += 1;
    if (dx || dy) { var m = Math.sqrt(dx * dx + dy * dy); dx /= m; dy /= m; }

    var k = clamp(dt * 11, 0, 1);
    player.vx += (dx * player.speed - player.vx) * k;
    player.vy += (dy * player.speed - player.vy) * k;
    player.x = clamp(player.x + player.vx * dt, player.r, W - player.r);
    player.y = clamp(player.y + player.vy * dt, player.r, H - player.r);
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    player.thrust = clamp(player.thrust + ((dx || dy) ? dt * 6 : -dt * 6), 0, 1);
    if (player.invuln > 0) player.invuln -= dt;

    player.fireTimer -= dt;
    if (mouse.down && player.fireTimer <= 0) {
      fire();
      player.fireTimer = 1 / player.fireRate;
    }

    /* ---- spawning ---- */
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      var base = Math.max(0.2, 1.18 - elapsed * 0.0068);
      spawnTimer = base * rand(0.72, 1.3);
      if (enemies.length < 95) spawnEnemy();
      if (elapsed > 45 && Math.random() < 0.3 && enemies.length < 80) spawnEnemy();
      if (elapsed > 110 && Math.random() < 0.28 && enemies.length < 80) spawnEnemy();
    }

    /* ---- bullets ---- */
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
        bullets.splice(i, 1);
        continue;
      }
      for (var j = enemies.length - 1; j >= 0; j--) {
        var e = enemies[j];
        var hr = e.r + 3.5;
        if (dist2(b.x, b.y, e.x, e.y) <= hr * hr) {
          e.hp -= b.dmg;
          e.flash = 0.09;
          e.ix += b.vx * 0.08;
          e.iy += b.vy * 0.08;
          burst(b.x, b.y, e.color, 4, 130, 0.24);
          bullets.splice(i, 1);
          if (e.hp <= 0) killEnemy(j, true);
          else beep(rand(300, 360), 0.03, 'square', 0.02, 200);
          break;
        }
      }
    }

    /* ---- enemies ---- */
    for (var a2 = enemies.length - 1; a2 >= 0; a2--) {
      var en = enemies[a2];
      if (en.flash > 0) en.flash -= dt;
      var ang = Math.atan2(player.y - en.y, player.x - en.x);
      en.ang = ang;
      var wob = 0;
      if (en.type === 'darter') wob = Math.sin(elapsed * 5.5 + en.seed) * 0.42;
      var ex = Math.cos(ang + wob) * en.speed;
      var ey = Math.sin(ang + wob) * en.speed;
      en.x += (ex + en.ix) * dt;
      en.y += (ey + en.iy) * dt;
      var edrag = Math.pow(0.02, dt);
      en.ix *= edrag; en.iy *= edrag;
      if (en.type === 'tank') en.rot += dt * 0.55;
      else if (en.type === 'darter') en.rot = ang + Math.sin(elapsed * 9 + en.seed) * 0.35;
      else en.rot = ang;

      // keep them from piling into one blob
      for (var b2 = a2 - 1; b2 >= 0; b2--) {
        var o = enemies[b2];
        var ddx = en.x - o.x, ddy = en.y - o.y;
        var sum = en.r + o.r;
        var d2 = ddx * ddx + ddy * ddy;
        if (d2 > 0.0001 && d2 < sum * sum) {
          var dd = Math.sqrt(d2);
          var push = (sum - dd) * 0.5;
          var nx = ddx / dd, ny = ddy / dd;
          en.x += nx * push; en.y += ny * push;
          o.x -= nx * push; o.y -= ny * push;
        }
      }

      // player collision
      if (state === STATE.PLAY && player.invuln <= 0) {
        var pr = en.r + player.r * 0.78;
        if (dist2(en.x, en.y, player.x, player.y) <= pr * pr) {
          hitPlayer(en);
          if (state !== STATE.PLAY) return;
        }
      }
    }

    /* ---- shards ---- */
    for (var s2 = shards.length - 1; s2 >= 0; s2--) {
      var sh = shards[s2];
      sh.life -= dt;
      if (sh.life <= 0) { shards.splice(s2, 1); continue; }
      sh.rot += sh.spin * dt;
      var dpx = player.x - sh.x, dpy = player.y - sh.y;
      var pd2 = dpx * dpx + dpy * dpy;
      if (pd2 < 145 * 145) {
        var pd = Math.sqrt(pd2) || 1;
        var pull = lerp(900, 120, pd / 145);
        sh.vx += (dpx / pd) * pull * dt;
        sh.vy += (dpy / pd) * pull * dt;
      }
      var sdrag = Math.pow(0.25, dt);
      sh.vx *= sdrag; sh.vy *= sdrag;
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      if (pd2 < (player.r + 12) * (player.r + 12)) {
        shards.splice(s2, 1);
        xp++; shardsCollected++; score += 2;
        burst(sh.x, sh.y, '#58ffa1', 5, 120, 0.3);
        beep(rand(1050, 1320), 0.05, 'sine', 0.05, 1900);
        while (xp >= xpNeed) levelUp();
      }
    }
  }

  function update(dt) {
    time += dt;
    updateStars(dt);
    updateParticles(dt);
    if (state === STATE.PLAY) updatePlay(dt);
    else updateAmbientOnly(dt);
    shake = Math.max(0, shake - dt * 34);
    if (state === STATE.OVER) overTimer += dt;
  }

  /* ============================================================
     Drawing
     ============================================================ */
  function poly(x, y, r, sides, rot) {
    ctx.beginPath();
    for (var i = 0; i < sides; i++) {
      var a = rot + (i / sides) * TAU;
      var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function dart(x, y, r, rot, spike) {
    ctx.beginPath();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.moveTo(r * spike, 0);
    ctx.lineTo(-r * 0.75, r * 0.7);
    ctx.lineTo(-r * 0.35, 0);
    ctx.lineTo(-r * 0.75, -r * 0.7);
    ctx.closePath();
    ctx.restore();
  }

  function drawEnemy(e, dim) {
    var flash = e.flash > 0 ? clamp(e.flash / 0.09, 0, 1) : 0;
    ctx.save();
    if (dim) ctx.globalAlpha = 0.45;
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rot);
    ctx.shadowBlur = e.glow + flash * 26;
    ctx.shadowColor = e.color;
    ctx.lineWidth = 2;
    ctx.strokeStyle = flash > 0.4 ? '#ffffff' : e.color;
    ctx.fillStyle = e.fill;
    if (e.type === 'darter') dart(0, 0, e.r, 0, 1.7);
    else poly(0, 0, e.r, e.sides, 0);
    ctx.fill();
    ctx.stroke();

    if (e.type === 'tank') {
      ctx.rotate(-e.rot * 1.8);
      ctx.beginPath();
      ctx.arc(0, 0, e.r * 0.42, 0, TAU);
      ctx.stroke();
      if (e.hp < e.maxhp) {
        ctx.rotate(e.rot * 1.8);
        var frac = clamp(e.hp / e.maxhp, 0, 1);
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2.5;
        ctx.arc(0, 0, e.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawPlayer() {
    var blink = player.invuln > 0 && (Math.floor(time * 14) % 2 === 0);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.globalAlpha = blink ? 0.32 : 1;

    // thruster
    if (player.thrust > 0.02) {
      var len = 10 + Math.random() * 10 + player.thrust * 12;
      ctx.save();
      ctx.rotate(player.angle + Math.PI);
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ffb340';
      var grad = ctx.createLinearGradient(0, 0, len, 0);
      grad.addColorStop(0, 'rgba(255,240,190,0.9)');
      grad.addColorStop(1, 'rgba(255,94,196,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-6, 5);
      ctx.lineTo(len, 0);
      ctx.lineTo(-6, -5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.rotate(player.angle);
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#5ef7ff';
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#a9fdff';
    ctx.fillStyle = 'rgba(94,247,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(player.r + 3, 0);
    ctx.lineTo(-player.r * 0.72, player.r * 0.82);
    ctx.lineTo(-player.r * 0.35, 0);
    ctx.lineTo(-player.r * 0.72, -player.r * 0.82);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // core
    ctx.beginPath();
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#ffffff';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.arc(0, 0, 3, 0, TAU);
    ctx.fill();

    // aim guide
    ctx.rotate(-player.angle);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(94,247,255,0.16)';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.arc(0, 0, player.r + 12 + Math.sin(time * 3) * 2, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  function drawBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      var tl = 0.035;
      var tx = b.x - b.vx * tl, ty = b.y - b.vy * tl;
      var g = ctx.createLinearGradient(tx, ty, b.x, b.y);
      g.addColorStop(0, 'rgba(94,247,255,0)');
      g.addColorStop(1, 'rgba(190,252,255,0.95)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#5ef7ff';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#eaffff';
    for (var j = 0; j < bullets.length; j++) {
      var c = bullets[j];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 2.4, 0, TAU);
      ctx.fill();
    }
  }

  function drawShards() {
    for (var i = 0; i < shards.length; i++) {
      var s = shards[i];
      var fade = s.life < 2 ? clamp(s.life / 2, 0, 1) : 1;
      var pulse = 0.75 + 0.25 * Math.sin(time * 6 + s.rot);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.shadowBlur = 16 * pulse;
      ctx.shadowColor = '#58ffa1';
      ctx.strokeStyle = '#9dffcb';
      ctx.fillStyle = 'rgba(88,255,161,0.28)';
      ctx.lineWidth = 1.6;
      poly(0, 0, 5.4, 4, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    ctx.shadowBlur = 0;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var t = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      var s = p.size * (0.35 + t * 0.65);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      var t = clamp(r.life / r.max, 0, 1);
      ctx.globalAlpha = t * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1 + t * 2.5;
      ctx.shadowBlur = 14;
      ctx.shadowColor = r.color;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  function drawTexts() {
    ctx.textAlign = 'center';
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i];
      var f = clamp(t.life / t.max, 0, 1);
      ctx.globalAlpha = f;
      ctx.fillStyle = t.color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = t.color;
      ctx.fillText(t.t, t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
  }

  function rr(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    var pad = 22;
    ctx.save();
    ctx.textBaseline = 'alphabetic';

    // score (top-left)
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(94,247,255,0.8)';
    ctx.fillStyle = '#eafcff';
    ctx.font = '800 30px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(score.toLocaleString('en-US'), pad, pad + 26);

    ctx.shadowBlur = 10;
    ctx.fillStyle = '#78b9dd';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('BEST ' + Math.max(best, score).toLocaleString('en-US'), pad, pad + 46);

    ctx.fillStyle = '#6f8fb0';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('TIME ' + Math.floor(elapsed) + 's   LV ' + player.level, pad, pad + 64);

    // lives (top-right)
    ctx.textAlign = 'right';
    ctx.fillStyle = '#78b9dd';
    ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(94,247,255,0.5)';
    ctx.fillText('HULL', W - pad, pad + 12);
    for (var i = 0; i < 3; i++) {
      var alive = i < player.lives;
      var cx = W - pad - 14 - i * 30, cy = pad + 34;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalAlpha = alive ? 1 : 0.2;
      ctx.shadowBlur = alive ? 16 : 0;
      ctx.shadowColor = '#5ef7ff';
      ctx.strokeStyle = '#a9fdff';
      ctx.fillStyle = alive ? 'rgba(94,247,255,0.28)' : 'rgba(120,185,221,0.1)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(11, 0);
      ctx.lineTo(-7, 8);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-7, -8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.textAlign = 'left';

    // XP bar (bottom)
    var bw = Math.min(600, W * 0.66), bh = 12;
    var bx = (W - bw) / 2, by = H - 34;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,22,48,0.75)';
    rr(bx, by, bw, bh, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(94,247,255,0.28)';
    ctx.lineWidth = 1;
    rr(bx, by, bw, bh, 6); ctx.stroke();

    var frac = clamp(xp / xpNeed, 0, 1);
    var fw = Math.max(0, (bw - 4) * frac);
    if (fw > 1) {
      var g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, '#2fe0a0');
      g.addColorStop(0.6, '#58ffa1');
      g.addColorStop(1, '#b6ffe0');
      ctx.fillStyle = g;
      ctx.shadowBlur = 16;
      ctx.shadowColor = 'rgba(88,255,161,0.85)';
      rr(bx + 2, by + 2, fw, bh - 4, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#9dffcb';
    ctx.font = '700 10px "Segoe UI", system-ui, sans-serif';
    ctx.shadowBlur = 8;
    ctx.shadowColor = 'rgba(88,255,161,0.7)';
    ctx.fillText('LEVEL ' + player.level + '   \u00b7   ' + xp + '/' + xpNeed + ' XP', W / 2, by - 8);
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;

    // fps (bottom-right, unobtrusive)
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(111,143,176,0.75)';
    ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
    ctx.shadowBlur = 0;
    ctx.fillText(Math.round(fpsAvg) + ' FPS', W - pad, H - 28);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    var ox = 0, oy = 0;
    if (shake > 0.1) { ox = rand(-shake, shake); oy = rand(-shake, shake); }
    ctx.save();
    ctx.translate(ox, oy);

    drawStars();

    ctx.globalCompositeOperation = 'lighter';

    if (state === STATE.START) {
      for (var i = 0; i < ambient.length; i++) drawEnemy(ambient[i], true);
      drawShards();
    } else {
      drawShards();
      drawRings();
      drawBullets();
      for (var j = 0; j < enemies.length; j++) drawEnemy(enemies[j], false);
      if (state === STATE.PLAY) drawPlayer();
      drawParticles();
      drawTexts();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (state === STATE.PLAY || state === STATE.OVER) drawHUD();
  }

  /* ============================================================
     Loop
     ============================================================ */
  var last = 0, fpsAvg = 60;
  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;      // clamp huge gaps (tab switches)
    if (dt < 0) dt = 0;
    if (dt > 0) fpsAvg += (1 / dt - fpsAvg) * clamp(dt * 2, 0, 1);
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ============================================================
     Input
     ============================================================ */
  function pressAction() {
    if (state === STATE.START) startGame();
    else if (state === STATE.OVER && overTimer > 0.35) startGame();
  }

  window.addEventListener('keydown', function (e) {
    var c = e.code || e.key;
    keys[c] = true;
    if (c === 'ArrowUp' || c === 'ArrowDown' || c === 'ArrowLeft' || c === 'ArrowRight' || c === 'Space') e.preventDefault();
    if (c === 'Space' || c === 'Enter' || c === 'NumpadEnter') {
      if (state !== STATE.PLAY) pressAction();
    }
    if (c === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.22; }
  });
  window.addEventListener('keyup', function (e) { keys[e.code || e.key] = false; });
  window.addEventListener('blur', function () { for (var k2 in keys) keys[k2] = false; mouse.down = false; });

  function pointer(ev) {
    var r = canvas.getBoundingClientRect();
    mouse.x = ev.clientX - r.left;
    mouse.y = ev.clientY - r.top;
  }
  window.addEventListener('mousemove', pointer, { passive: true });
  window.addEventListener('mousedown', function (ev) {
    pointer(ev);
    mouse.down = true;
    initAudio();
    if (state !== STATE.PLAY) pressAction();
  });
  window.addEventListener('mouseup', function () { mouse.down = false; });
  window.addEventListener('contextmenu', function (ev) {
    if (ev.target === canvas) ev.preventDefault();
  });

  /* ============================================================
     Boot
     ============================================================ */
  resize();
  mouse.x = W / 2; mouse.y = H / 2 - 100;
  resetGame();
  resetAmbient();
  state = STATE.START;

  // inspection hook (handy for tests / debugging)
  window.STARFALL = {
    STATE: STATE,
    player: player,
    enemies: enemies,
    stats: function () {
      return {
        state: state, score: score, level: player.level, lives: player.lives,
        t: elapsed, enemies: enemies.length, bullets: bullets.length,
        shards: shards.length, parts: particles.length, fireRate: player.fireRate,
        fps: fpsAvg, xp: xp, xpNeed: xpNeed
      };
    }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
