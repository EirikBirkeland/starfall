# Publishes the playable site to GitHub Pages on every push to main.
# The front page is the version menu (releases/index.html); each release is at /v<version>/ and the
# development build at /dev/.
name: Publish the version menu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/dev
          cp -r releases/. _site/
          cp -r index.html src _site/dev/
          [ -d assets ] && cp -r assets _site/dev/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
